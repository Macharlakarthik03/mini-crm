<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mini CRM</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo-mark"><i class="fa-solid fa-chart-line" style="color:#fff;font-size:14px;"></i></span>
      Mini CRM
    </div>

    <ul class="nav-list">
      <li><a href="dashboard.html" class="active"><i class="fa-solid fa-grip"></i> Dashboard</a></li>
      <li><a href="leads.html"><i class="fa-solid fa-users"></i> Leads</a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="admin-chip">
        <div class="avatar" id="adminAvatar">A</div>
        <div>
          <div class="name" id="adminName">Admin</div>
          <div class="role">Administrator</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <h1>Dashboard</h1>
          <div class="today" id="todayDate"></div>
        </div>
      </div>
      <a href="leads.html" class="btn btn-add"><i class="fa-solid fa-plus"></i> Add Lead</a>
    </div>

    <!-- Stat cards -->
    <div class="stats-grid">
      <div class="stat-card c-total">
        <div class="top-row">
          <span class="icon-box"><i class="fa-solid fa-users"></i></span>
        </div>
        <div class="num" id="statTotal">0</div>
        <div class="label">Total Leads</div>
      </div>

      <div class="stat-card c-new">
        <div class="top-row">
          <span class="icon-box"><i class="fa-solid fa-star"></i></span>
        </div>
        <div class="num" id="statNew">0</div>
        <div class="label">New Leads</div>
      </div>

      <div class="stat-card c-contacted">
        <div class="top-row">
          <span class="icon-box"><i class="fa-solid fa-phone"></i></span>
        </div>
        <div class="num" id="statContacted">0</div>
        <div class="label">Contacted Leads</div>
      </div>

      <div class="stat-card c-converted">
        <div class="top-row">
          <span class="icon-box"><i class="fa-solid fa-circle-check"></i></span>
        </div>
        <div class="num" id="statConverted">0</div>
        <div class="label">Converted Leads</div>
      </div>
    </div>

    <!-- Overview panels -->
    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-header">
          <h2>Recent Leads</h2>
          <a href="leads.html" style="font-size:12.5px; color:var(--primary); font-weight:600;">View all <i class="fa-solid fa-arrow-right" style="font-size:10px;"></i></a>
        </div>
        <div class="mini-list" id="recentLeadsList">
          <div class="loading-row"><td>Loading recent leads...</td></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Leads by Source</h2>
        </div>
        <div class="source-breakdown" id="sourceBreakdown"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
